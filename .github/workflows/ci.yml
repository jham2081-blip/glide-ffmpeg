name: lightweight-engineering-assurance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glide-assurance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-assurance:
    name: Python source assurance
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Compile tracked Python source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.py')
          if ((${#files[@]})); then
            python -m py_compile "${files[@]}"
          fi

      - name: Confirm repository metadata exists
        run: |
          test -f README.md
          test -f LICENSE
          test -f requirements.txt
